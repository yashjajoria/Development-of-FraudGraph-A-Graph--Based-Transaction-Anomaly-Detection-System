[project]
name = "fraudgraph-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi", "uvicorn[standard]", "sqlalchemy>=2.0", "psycopg[binary]",
  "pydantic-settings", "httpx", "groq", "google-genai",
  "networkx>=3.2", "jsonschema", "pytest", "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
